name: CI                      # the name shown in GitHub's "Actions" tab

on:                           # TRIGGERS: when to run
  pull_request:               #   on every pull request
  push:
    branches: [main]          #   and on every push to main

jobs:
  test:                       # a job called "test"
    runs-on: ubuntu-latest    # a fresh Linux machine from GitHub
    steps:
      - uses: actions/checkout@v7        # 1. download your repo onto the machine
      - uses: actions/setup-python@v7    # 2. install Python...
        with:
          python-version: "3.13"         #    ...the same version as your Dockerfile
      - run: pip install -r requirements-dev.txt   # 3. install app + test packages
      - run: python -m pytest                      # 4. run the tests


    build:
      needs: test                          # run only AFTER the test job passes
      if: github.event_name == 'push'      # only on pushes to main, not on pull requests
      runs-on: ubuntu-latest
      permissions:                         # least privilege for this job's token
        contents: read                     #   read the code
        packages: write                    #   push images to GitHub's registry
      env:
        IMAGE: ghcr.io/osheravraham/hello-service   # registry/owner/name (must be lowercase)
      steps:
        - uses: actions/checkout@v7

        - name: Build image
          run: docker build -t $IMAGE:${{ github.sha }} .
          # tag = the commit ID, so every image points to exactly one commit

        - name: Scan image with Trivy
          uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
          with:
            image-ref: ${{ env.IMAGE }}:${{ github.sha }}
            severity: CRITICAL,HIGH        # only these severities matter
            ignore-unfixed: true           # skip CVEs that have no fix yet
            exit-code: "1"                 # FAIL the pipeline if any are found

        - name: Log in to GitHub Container Registry
          uses: docker/login-action@v4
          with:
            registry: ghcr.io
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}

        - name: Push image
          run: docker push $IMAGE:${{ github.sha }}